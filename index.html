<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Орден Дельти</title>
<meta name="description" content="Фізичний роглайк для студентів: замок паладинів, кімнати з підказками і двері, що відчиняються правильною відповіддю.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- головне меню з вкладками -->
  <section id="scr-main" class="screen">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">Δ</span>
        <div>
          <div class="brand-title">Орден Дельти</div>
          <div class="brand-sub">фізичний роглайк</div>
        </div>
      </div>
      <button class="iconbtn" id="btn-sound" aria-label="Звук"></button>
    </header>
    <main class="wrap">
      <div id="tab-levels" class="tab"></div>
      <div id="tab-rating" class="tab" hidden></div>
    </main>
    <nav class="tabbar" role="tablist">
      <button role="tab" data-tab="levels" class="on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11h-5v-6H9v6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Рівні</span>
      </button>
      <button role="tab" data-tab="rating">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Рейтинг</span>
      </button>
    </nav>
  </section>

  <!-- гра -->
  <section id="scr-game" class="screen" hidden>
    <div class="hud">
      <button class="iconbtn" id="btn-menu" aria-label="Меню">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="hud-room">
        <div class="hud-room-n" id="hud-n"></div>
        <div class="hud-room-name" id="hud-name"></div>
      </div>
      <div class="hud-timer" id="hud-timer">00:00</div>
    </div>
    <div class="inv" id="inv"></div>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <div class="banner" id="banner" hidden></div>
  </section>
</div>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="fade" class="fade"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
